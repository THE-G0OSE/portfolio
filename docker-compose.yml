services:
  db:
    image: postgres:17-alpine
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    # 5434 on host: 5432 is taken by local postgres, 5433 by another container
    ports:
      - "5434:5432"
    volumes:
      - portfolio-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  portfolio-db-data:
